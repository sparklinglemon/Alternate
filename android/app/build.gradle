plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing (see ANDROID_RELEASE_SETUP.md). The release key comes from android/keystore.properties
// (storeFile, storePassword, keyAlias, keyPassword) or, in CI, from the RELEASE_KEYSTORE_FILE,
// RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD environment variables or Gradle properties.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSetting = { String propertiesKey, String name ->
    keystoreProperties[propertiesKey] ?: findProperty(name) ?: System.getenv(name)
}
def releaseStoreFile = releaseSetting('storeFile', 'RELEASE_KEYSTORE_FILE')
def releaseStorePassword = releaseSetting('storePassword', 'RELEASE_KEYSTORE_PASSWORD')
def releaseKeyAlias = releaseSetting('keyAlias', 'RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSetting('keyPassword', 'RELEASE_KEY_PASSWORD') ?: releaseStorePassword
def hasReleaseKey = releaseStoreFile && releaseStorePassword && releaseKeyAlias
// The release workflow passes -PrequireReleaseKey so a missing key fails the build instead of shipping a debug-signed APK.
if (!hasReleaseKey && findProperty('requireReleaseKey')) {
    throw new GradleException('requireReleaseKey is set but no release key is configured: provide android/keystore.properties ' +
            'or RELEASE_KEYSTORE_FILE, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.')
}

android {
    namespace 'com.lulu786.Alternate'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lulu786.Alternate'
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "3.1.0"
        resourceConfigurations += ['en']
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseKey) {
                // keystore.properties paths are relative to android/app, like before; absolute paths work too.
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Without a release key (local test builds, build-apk.yml) fall back to the debug key so the APK still
            // installs. Such an APK can't update a release-signed install; android-release.yml refuses to publish one.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['kotlin/**', 'META-INF/**', '**/*.kotlin_builtins', 'DebugProbesKt.bin']
        }
    }

    dependenciesInfo {
        // No dependency metadata blob (for IzzyOnDroid/F-Droid)
        includeInApk false
        includeInBundle false
    }

    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // Skip generated null-check calls; smaller dex.
        freeCompilerArgs.addAll('-Xno-param-assertions', '-Xno-call-assertions', '-Xno-receiver-assertions')
    }
}

// No dependencies: the app only uses the Android framework (plus the Kotlin stdlib, shrunk by R8).
