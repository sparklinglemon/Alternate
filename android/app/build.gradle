plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing (see ANDROID_RELEASE_SETUP.md)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.lulu786.Alternate'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lulu786.Alternate'
        minSdk 24
        targetSdk 35
        versionCode 16
        versionName "3.0.0"
        resourceConfigurations += ['en']
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['kotlin/**', 'META-INF/**', '**/*.kotlin_builtins', 'DebugProbesKt.bin']
        }
    }

    dependenciesInfo {
        // No dependency metadata blob (for IzzyOnDroid/F-Droid)
        includeInApk false
        includeInBundle false
    }

    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // Skip generated null-check calls; smaller dex.
        freeCompilerArgs.addAll('-Xno-param-assertions', '-Xno-call-assertions', '-Xno-receiver-assertions')
    }
}

// No dependencies: the app only uses the Android framework (plus the Kotlin stdlib, shrunk by R8).
