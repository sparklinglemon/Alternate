name: Android Release Build

on:
  push:
    tags:
      - "*"

env:
  JAVA_VERSION: "17"
  KEYSTORE_FILE: "release.jks"

permissions:
  contents: write # create the release and upload the APK

jobs:
  build:
    name: Build and Release Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Set up release signing (only if secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: the APK is signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/${{ env.KEYSTORE_FILE }}
          cat > android/keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=${{ env.KEYSTORE_FILE }}
          EOF

      - name: Build Release APKs
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Get tag name and version code
        id: tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          # Extract versionCode from the app's build.gradle
          VERSION_CODE=$(grep -o 'versionCode[[:space:]]*[0-9]\+' android/app/build.gradle | grep -o '[0-9]\+')
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Get changelog from versionCode
        id: changelog
        run: |
          VERSION_CODE=${{ steps.tag.outputs.version_code }}
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          # Read the changelog file based on versionCode
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            # Read the changelog content and format it
            CHANGELOG_CONTENT=$(cat "$CHANGELOG_FILE")
            # Extract version and description from the first line
            VERSION_LINE=$(echo "$CHANGELOG_CONTENT" | head -n 1)
            VERSION=$(echo "$VERSION_LINE" | cut -d' ' -f1)
            DESCRIPTION=$(echo "$VERSION_LINE" | cut -d'–' -f2 | sed 's/^ *//')
            if [ -z "$DESCRIPTION" ]; then
              DESCRIPTION=$(echo "$VERSION_LINE" | cut -d'-' -f2- | sed 's/^ *//')
            fi
            
            # Extract bullet points (skip the first line)
            BULLET_POINTS=$(echo "$CHANGELOG_CONTENT" | tail -n +2 | sed 's/^[ ]*-[ ]*/- /')
            
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "description=${DESCRIPTION}" >> $GITHUB_OUTPUT
            
            # Save bullet points to a file to preserve multiline content
            echo "$BULLET_POINTS" > changelog_bullets.txt
            echo "changelog_file=changelog_bullets.txt" >> $GITHUB_OUTPUT
            
            # Set changelog bullets as output variable for use in release body
            echo "changelog_bullets<<EOF" >> $GITHUB_OUTPUT
            echo "$BULLET_POINTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.tag.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "description=Latest Release" >> $GITHUB_OUTPUT
            echo "- Latest improvements and bug fixes" > changelog_bullets.txt
            echo "changelog_file=changelog_bullets.txt" >> $GITHUB_OUTPUT
            
            # Set default changelog bullets as output variable
            echo "changelog_bullets<<EOF" >> $GITHUB_OUTPUT
            echo "- Latest improvements and bug fixes" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Name the APK after the tag
        run: cp android/app/build/outputs/apk/release/app-release.apk "alternate-${{ steps.tag.outputs.tag }}.apk"

      - name: Create release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            alternate-${{ steps.tag.outputs.tag }}.apk
            android/app/build/outputs/apk/release/output-metadata.json
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            # 🚀 Alternate ${{ steps.tag.outputs.tag }} – ${{ steps.changelog.outputs.description }}

            ## ✨ What's New in ${{ steps.tag.outputs.tag }}

            ${{ steps.changelog.outputs.changelog_bullets }}

            ## 📦 Download

            One universal APK works on every device (ARM and x86, 32 and 64-bit).

            ## 🔧 Installation

            1. Download the APK
            2. Enable "Install from unknown sources" in your Android settings
            3. Install the APK file

            ## 📋 System Requirements

            - Android 7.0 (API level 24) or higher
            - Permissions: Phone, Call log, Display over other apps
