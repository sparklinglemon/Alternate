name: Android Release Build

# Builds the APK signed with the release key and publishes it as a GitHub release when a v* tag is pushed.
# Tags containing '-' (for example v3.1.0-beta1) are published as pre-releases.
# Needs the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets (see ANDROID_RELEASE_SETUP.md);
# without them the run fails and nothing is published.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. A release must be signed with the release key; see ANDROID_RELEASE_SETUP.md. Nothing was published."
            exit 1
          fi

      - name: Get tag name and version code
        id: tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          # Extract versionCode from the app's build.gradle
          VERSION_CODE=$(grep -o 'versionCode[[:space:]]*[0-9]\+' android/app/build.gradle | grep -o '[0-9]\+')
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Check versionCode is higher than the last release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.tag.outputs.version_code }}
        run: |
          # Android only installs an update over an existing install when its versionCode is higher.
          PREVIOUS_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No earlier release: nothing to compare against."
            exit 0
          fi
          if ! gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern output-metadata.json --dir "$RUNNER_TEMP/previous"; then
            echo "::warning::Release $PREVIOUS_TAG has no output-metadata.json; skipping the versionCode check."
            exit 0
          fi
          PREVIOUS_CODE=$(jq '.elements[0].versionCode' "$RUNNER_TEMP/previous/output-metadata.json")
          echo "Last release $PREVIOUS_TAG has versionCode $PREVIOUS_CODE; this build has $VERSION_CODE."
          if [ "$VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
            echo "::error::versionCode $VERSION_CODE is not higher than $PREVIOUS_CODE from $PREVIOUS_TAG, so it would not install as an update. Bump versionCode in android/app/build.gradle and tag again."
            exit 1
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Kept outside the checkout so it can never end up in an artifact or commit.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # requireReleaseKey makes Gradle fail rather than fall back to the debug key.
          ./gradlew assembleRelease --no-daemon -PrequireReleaseKey=true

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          if grep -q 'CN=Android Debug' apksigner.txt; then
            echo "::error::The APK is signed with the Android debug key. Refusing to publish it."
            exit 1
          fi

      - name: Get changelog from versionCode
        id: changelog
        run: |
          VERSION_CODE=${{ steps.tag.outputs.version_code }}

          # Read the changelog file based on versionCode
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            # Extract the description from the first line
            VERSION_LINE=$(head -n 1 "$CHANGELOG_FILE")
            DESCRIPTION=$(echo "$VERSION_LINE" | cut -d'–' -f2 | sed 's/^ *//')
            if [ -z "$DESCRIPTION" ]; then
              DESCRIPTION=$(echo "$VERSION_LINE" | cut -d'-' -f2- | sed 's/^ *//')
            fi
            # Bullet points (skip the first line)
            tail -n +2 "$CHANGELOG_FILE" | sed 's/^[ ]*-[ ]*/- /' > changelog_bullets.txt
          else
            DESCRIPTION="Latest Release"
            echo "- Latest improvements and bug fixes" > changelog_bullets.txt
          fi
          echo "description=${DESCRIPTION}" >> $GITHUB_OUTPUT

      - name: Write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DESCRIPTION: ${{ steps.changelog.outputs.description }}
        run: |
          {
            echo "# 🚀 Alternate $TAG – $DESCRIPTION"
            echo
            echo "## ✨ What's New in $TAG"
            echo
            cat changelog_bullets.txt
            cat <<'EOF'

          ## 📦 Download

          One universal APK works on every device (ARM and x86, 32 and 64-bit).

          ## 🔧 Installation

          1. Download the APK
          2. Enable "Install from unknown sources" in your Android settings
          3. Install the APK file

          Updating from an earlier release of this fork installs in place. If you still have the upstream
          Alternate app installed, uninstall it first: it is signed with a different key, so Android won't update it.

          ## 📋 System Requirements

          - Android 7.0 (API level 24) or higher
          - Permissions: Phone, Call log, Display over other apps
          EOF
          } > release_notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          OUT=android/app/build/outputs/apk/release
          cp "$OUT/app-release.apk" "alternate-$TAG.apk"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --notes-file release_notes.md \
            $PRERELEASE \
            "alternate-$TAG.apk" \
            "$OUT/output-metadata.json"
