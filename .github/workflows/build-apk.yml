name: Build APK

# Builds the release APK on every push and pull request and attaches it to the run as an artifact
# (Actions tab -> run -> Artifacts). Can also be started by hand from the Actions tab.
# Signed with the release key when the KEYSTORE_* secrets exist, otherwise with the debug key (a debug-signed
# APK installs fine for testing but can't update a release install). Only android-release.yml publishes releases.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing (only if secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret: the APK will be signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alternate-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
